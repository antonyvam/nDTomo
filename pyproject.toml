[build-system]
requires = ["setuptools<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nDTomo"
dynamic = ["version"]                      # read from your package
description = "nDTomo software suite"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "A. Vamvakeros", email = "antonyvam@gmail.com" }]
license = { file = "LICENSE" }
urls = { Homepage = "http://github.com/antonyvam/nDTomo" }
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
  "h5py",
  "matplotlib",
  "numpy",
  "scipy",
  "siphash24",
  "pyqtgraph",
  "scikit-image",
  "scikit-learn",
  "xdesign",
  "setuptools<81",
  "tqdm",
  "ipykernel",
  "pystackreg",
  "tifffile",
  "jupyterlab",
  "algotom",
  "fabio",
  "pyFAI>=2025.01",
  "napari",
  "configobj",
  "ipympl",
  "pyqt5",
  "pyopencl",
  "jupyterlab_widgets",
  "xgboost",
  "cupy-cuda12x"
]

[project.optional-dependencies]
torch = ["torch", "torchvision", "torchaudio"]

[project.gui-scripts]
nDTomoGUI = "nDTomo.gui.nDTomoGUI:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
nDTomo = ["*.txt", "*.rst"]

[tool.setuptools.dynamic]
version = { attr = "nDTomo.__version__" }

[tool.setuptools.packages.find]
where = ["."]  # scan the root directory
include = ["nDTomo*"]  # include nDTomo and any subpackages

# ---------------------------------------------------------
# Ruff Configuration
# ---------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 120

# Skip Sphinx doc configs and build artifacts
extend-exclude = [
    "docs/source/conf.py",
    "_build",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "PIE", # flake8-pie
    "RUF", # Ruff-specific rules
    "B",   # flake8-bugbear
]

ignore = [
    # Allow formatting to dictate line breaks without failing the build
    "E501",
    # Allow scientific variable naming: 'I' for intensity, 'l' for indices
    "E741",
    # Allow mathematical symbols (gamma, multiplication signs, en-dashes) in docstrings/UI
    "RUF001",
    "RUF002",
    # Allow non-PEP8 mixed-case package/module names (nDTomo, nDTomoGUI, shapes2D)
    "N999",
    # Allow blind `except Exception:` (common in GUI error handlers)
    "BLE001",
    # Allow raising built-in Exception(...)
    "TRY002",
    # Allow dynamic default for device checks (e.g., torch.cuda.is_available())
    "B008",
    # Allow try-except-pass in fallback blocks
    "S110",
    # Do not force ternary operators on multiline if/else logic
    "SIM108",
    # Allow legacy %-formatting without breaking CI
    "UP031",
]

[tool.ruff.lint.per-file-ignores]
# Interactive notebooks frequently redefine variables, import out of order, or have unused imports
"docs/source/notebooks/*.ipynb" = ["F401", "F811", "E722", "E402", "RUF059"]

# Mock & lazy imports
"nDTomo/pytorch/segmentation_torch.py" = ["TC004"]
"nDTomo/pytorch/__init__.py" = ["F401"]
